services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luxtalent-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./src/python/ml/model:/app/src/python/ml/model
    environment:
      INBOX_DIR: /app/data/input_CVs
      PROCESSED_DIR: /app/data/processed_CVs
      LOG_PATH: /app/data/screening_log.csv
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luxtalent-watcher
    volumes:
      - ./data:/app/data
      - ./src/python/ml/model:/app/src/python/ml/model
    environment:
      INBOX_DIR: /app/data/input_CVs
      PROCESSED_DIR: /app/data/processed_CVs
      REGISTRY_PATH: /app/data/processed_registry.json
      LOG_PATH: /app/data/screening_log.csv
      POLL_INTERVAL: "5"  # Check every 5 seconds
      PYTHONUNBUFFERED: "1"
    # Override the default Gunicorn CMD to run the watcher script instead
    command: ["python", "src/python/watcher.py"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy