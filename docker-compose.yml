services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luxtalent-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./src/python/ml/model:/app/src/python/ml/model
    environment:
      INBOX_DIR: /app/data/input_CVs
      PROCESSED_DIR: /app/data/processed_CVs
      LOG_PATH: /app/data/screening_log.csv
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FLASK_API_URL: "http://api:8000"
    container_name: luxtalent-frontend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres.bipntqlieakiyocaycuo:UgeLCXxfhi0gbdLG@aws-0-eu-west-3.pooler.supabase.com:6543/postgres?sslmode=require&pgbouncer=true"
      NEXT_PUBLIC_USE_MOCK: "false"
      NODE_ENV: production
      NEXTAUTH_SECRET: "a7f3b9c2e1d4f6a8b0c3e5d7f9a1b3c5"
      NEXTAUTH_URL: "http://localhost:3000"
      AUTH_PASSWORD: "luxtalent"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
